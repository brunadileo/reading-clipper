<!DOCTYPE html>
<html id="popup">
	<head>
		<title data-i18n="extensionName">Lazy Reader Clipper</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link rel="stylesheet" href="style.css">
		<script src="browser-polyfill.min.js"></script>
	</head>
	<body id="popup-container">
		<div id="popup-header" class="lr-popup-head">
			<span class="lr-tile" aria-hidden="true"><img src="icons/icon48.png" alt=""></span>
			<span class="lr-popup-title" data-i18n="reading">Lazy Reader</span>
			<button type="button" id="open-settings" class="lr-iconbtn" data-i18n-title="settings">
				<i data-lucide="settings"></i>
			</button>
		</div>
		<p class="error-message lr-card lr-error" role="alert" style="display: none;"></p>
		<div id="reading-status" class="reading-status" style="display: none;" data-state="saving">
			<div class="lr-connect lr-status-card" role="status">
				<div class="lr-connect-top">
					<span class="lr-tile st-tile" aria-hidden="true"><img src="icons/icon48.png" alt=""></span>
					<span class="lr-spinner st-spinner" aria-hidden="true"></span>
					<span class="lr-dot st-dot" aria-hidden="true"></span>
					<p id="reading-status-message" class="lr-status-message"></p>
				</div>
				<a href="#" id="reading-open-link" class="lr-btn lr-btn-primary lr-btn-lg lr-btn-block" target="_blank" rel="noopener" style="display: none;" data-i18n="openInLazyReader"></a>
				<button type="button" id="reading-try-again" class="lr-btn lr-btn-primary lr-btn-lg lr-btn-block" style="display: none;" data-i18n="tryAgain"></button>
				<button type="button" id="reading-sign-in" class="lr-btn lr-btn-primary lr-btn-lg lr-btn-block" style="display: none;" data-i18n="readingSignIn"></button>
				<button type="button" id="reading-done" class="lr-btn lr-btn-ghost lr-btn-block" style="display: none;" data-i18n="done"></button>
			</div>
		</div>
		<div class="clipper">
			<div class="lr-popup-body">
				<div class="lr-page-card">
					<span class="lr-tile" id="page-tile" aria-hidden="true"></span>
					<div class="page-card-text">
						<textarea id="note-name-field" type="text" rows="1" data-i18n="pageTitleLabel"></textarea>
						<span id="page-site"></span>
					</div>
				</div>
				<button id="clip-btn" class="lr-btn lr-btn-primary lr-btn-lg lr-btn-block"><!-- Text set by determineMainAction --></button>
			</div>
			<div class="lr-popup-foot">
				<span class="foot-state"><span class="lr-dot" id="foot-dot" aria-hidden="true"></span><span id="foot-state"></span></span>
				<a id="foot-open" href="https://lazyreader.app" target="_blank" rel="noopener" data-i18n="openLazyReader">Open Lazy Reader</a>
			</div>
		</div>
		<!-- READ-236: the Obsidian-era pieces stay in the DOM so popup.ts finds every id. Nothing here is shown. -->
		<div id="obsidian-legacy" hidden>
			<div id="template-container">
				<select id="template-select">
					<option value=""></option>
				</select>
			</div>
			<div class="popup-actions">
				<a href="#" id="show-variables" class="clickable-icon" data-i18n-title="showPageVariables">
					<i data-lucide="ellipsis"></i>
				</a>
				<a href="#" id="highlighter-mode" class="clickable-icon" data-i18n-title="highlightPage">
					<i data-lucide="highlighter"></i>
				</a>
				<a href="#" id="reader-mode" class="clickable-icon" data-i18n-title="reader">
					<i data-lucide="book-open"></i>
				</a>
				<a href="#" id="embedded-mode" class="clickable-icon" data-i18n-title="openEmbedded">
					<i data-lucide="picture-in-picture-2"></i>
				</a>
			</div>
			<div class="metadata-properties-header">
				<span data-i18n="properties"></span>
				<i data-lucide="chevron-down"></i>
			</div>
			<div class="metadata-properties"></div>
			<div id="note-content-container">
				<textarea id="note-content-field" rows="4" data-i18n="notesAboutPage"></textarea>
			</div>
			<div class="vault-path-container">
				<div id="vault-container" style="display: none;">
					<select id="vault-select"></select>
				</div>
				<input id="path-name-field" type="text" data-i18n="folder"/>
			</div>
			<div id="interpreter" style="display: none;">
				<textarea id="prompt-context" rows="3"></textarea>
				<div class="interpreter-controls">
					<select id="model-select" style="display: none;"></select>
					<button id="interpret-btn" data-i18n="interpret"></button>
					<span id="interpreter-timer" style="display: none;"></span>
				</div>
				<div id="token-counter" class="token-counter"></div>
				<div id="interpreter-error" style="display: none;"></div>
			</div>
			<div class="action-buttons" id="action-buttons">
				<div class="menu-btn">
					<button id="more-btn"><i data-lucide="chevron-down"></i></button>
					<div class="menu" id="more-dropdown">
						<div class="secondary-actions">
							<!-- Secondary actions will be populated by ts -->
						</div>
					</div>
				</div>
				<div class="share-btn">
					<a class="share-content clickable-icon" data-i18n-title="share"><i data-lucide="share"></i></a>
				</div>
			</div>
		</div>
		<script type="module" src="popup.js"></script>
	</body>
</html>
